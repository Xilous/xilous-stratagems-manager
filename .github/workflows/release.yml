name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Read the package version from Cargo.toml/Cargo.lock.
          $metadata = cargo metadata `
            --locked `
            --no-deps `
            --format-version 1 |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "xilous-stratagems-manager" } |
            Select-Object -First 1

          if (-not $package) {
            throw "Package xilous-stratagems-manager was not found"
          }

          # Require the tag to match the Cargo package version.
          $expectedTag = "v$($package.version)"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version)"
          }

          cargo build --release --locked

          $exe = "target\release\XilousStratagemsManager.exe"
          $packageDir = "dist\package\XilousStratagemsManager"
          $zipName = "XilousStratagemsManager-$expectedTag-windows-x64.zip"
          $zipPath = "dist\$zipName"

          if (-not (Test-Path $exe)) {
            throw "Executable was not produced: $exe"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageDir |
            Out-Null

          Copy-Item `
            -Path $exe `
            -Destination "$packageDir\XilousStratagemsManager.exe"

          Copy-Item `
            -Path "LICENSE" `
            -Destination $packageDir

          # Compress the directory itself so the ZIP contains one top-level
          # XilousStratagemsManager folder.
          Compress-Archive `
            -Path $packageDir `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          # Windows installer (per-user, Start Menu entry, uninstaller).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress | Out-Null
          }
          & $iscc /Q "/DAppVersion=$($package.version)" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setupName = "XilousStratagemsManager-Setup-$($package.version).exe"
          if (-not (Test-Path "dist\$setupName")) {
            throw "Installer was not produced: dist\$setupName"
          }

          "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          "SETUP_NAME=$setupName" >> $env:GITHUB_ENV

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/package/XilousStratagemsManager/XilousStratagemsManager.exe
            dist/*.zip
            dist/XilousStratagemsManager-Setup-*.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @(
            "**Download ``$env:SETUP_NAME`` below and run it.** It installs for the current user (no administrator rights), adds a Start Menu entry, and can optionally add a desktop shortcut and start with Windows. Uninstall from *Apps & features*; your presets are kept unless you choose to remove them.",
            "",
            "Prefer no installer? ``XilousStratagemsManager.exe`` is the portable build: put it in a folder of its own and run it.",
            "",
            "Windows SmartScreen may warn about an unsigned download: choose *More info* > *Run anyway*. All files carry a GitHub build attestation (``gh attestation verify <file> --owner Xilous``).",
            "",
            "See the [README](https://github.com/Xilous/xilous-stratagems-manager#readme) for setup, in particular the arrow-key stratagem input setting in the game."
          ) -join "`n"

          $releaseArgs = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "dist\$env:SETUP_NAME#$env:SETUP_NAME (installer, recommended)",
            "dist\package\XilousStratagemsManager\XilousStratagemsManager.exe#XilousStratagemsManager.exe (portable)",
            "dist\$env:ZIP_NAME#$env:ZIP_NAME (portable exe + LICENSE)",
            "--verify-tag",
            "--generate-notes",
            "--notes", $notes,
            "--title", "Xilous Stratagems Manager $env:GITHUB_REF_NAME"
          )

          if ($env:GITHUB_REF_NAME -match "-") {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
