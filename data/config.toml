[presets]
# Apply Stratagems in the order they were saved.
apply_in_saved_order = false

# Press B after applying a preset with a booster.
auto_ready_up = false

# If a saved Booster is already in use, save a manually selected one as its fallback.
save_fallback_when_taken = false

# Optional labels shown beside presets in the window.
[presets.labels]
# preset_1 = "Terminids"
# preset_2 = "Automatons"
# preset_3 = "Illuminate"
# preset_4 = "Eradicate"

[hotkey]
# Modifiers held together with the preset keys on the loadout screen.
# Values: shift, ctrl, alt, win.
modifiers = ["shift"]

# Preset keys, mapped to preset_1..preset_4 in order. Values: f1-f12. Use 1-4 keys.
keys = ["f1", "f2", "f3", "f4"]

[mission]
# Call in Stratagems during missions with hotkeys.
enabled = true

# Keys that call in slots 1-4 of the active loadout while Helldivers 2 is focused.
# A key may include modifiers, e.g. "alt+f1".
slot_keys = ["f1", "f2", "f3", "f4"]

# Key bound to "Stratagem Menu" in the game. Editable in the window.
menu_key = "lctrl"

# hold: the menu stays open while the key is held (game default). press: the key toggles it.
menu_mode = "hold"

# Keys bound to the Stratagem directions in the game. Editable in the window.
# Arrow keys are strongly recommended so movement keys never corrupt a code.
direction_up = "up"
direction_down = "down"
direction_left = "left"
direction_right = "right"

# Timing in milliseconds.
menu_open_delay_ms = 60
key_hold_ms = 40
key_gap_ms = 40
menu_release_delay_ms = 40

# Hotkeys for mission Stratagems that are available in every loadout.
# Assign them in the window, or here by catalog id. Unassigned ones are inactive.
[mission.bindings]
# reinforce = "f5"
# resupply = "f6"
# sos-beacon = "ctrl+f5"

[window]
# Start with the window hidden in the tray.
start_hidden = false
